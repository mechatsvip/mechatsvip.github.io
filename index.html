<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f6f7f2">
  <meta name="description" content="一处记录想法与日常的个人博客。">
  <title>Mecha 的博客</title>
  <script>
    try {
      const savedTheme = localStorage.getItem('mecha-theme');
      const initialTheme = savedTheme || (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
      document.documentElement.dataset.theme = initialTheme;
    } catch (_) {}
  </script>
  <style>
    :root {
      color-scheme: light;
      --paper: #f6f7f2;
      --surface: #fff;
      --ink: #202a25;
      --muted: #758078;
      --line: #e4e9e2;
      --accent: #33745b;
      --accent-dark: #24553f;
      --accent-soft: #e8f1e9;
      --hero-text: #69756d;
      --hover: #fbfcf9;
      --code-bg: #f4f7f2;
      --pre-bg: #f7f9f5;
      --tag-bg: #f5f8f3;
      --serif: Georgia, "Noto Serif SC", "Songti SC", serif;
      --sans: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans SC", sans-serif;
      --shadow: 0 18px 50px rgba(37, 61, 46, .07);
    }
    :root[data-theme="dark"] {
      color-scheme: dark;
      --paper: #151a17;
      --surface: #1d2420;
      --ink: #e6ece7;
      --muted: #9aa79e;
      --line: #303b34;
      --accent: #86c3a0;
      --accent-dark: #a4d5b7;
      --accent-soft: #263a2e;
      --hero-text: #b4c0b7;
      --hover: #222b26;
      --code-bg: #222b26;
      --pre-bg: #1a211d;
      --tag-bg: #222d26;
      --shadow: 0 18px 50px rgba(0, 0, 0, .22);
    }
    *, *::before, *::after { box-sizing: border-box; }
    html { scroll-behavior: smooth; }
    body { margin: 0; color: var(--ink); background: var(--paper); font-family: var(--sans); line-height: 1.75; -webkit-font-smoothing: antialiased; transition: background .2s ease, color .2s ease; }
    a { color: inherit; }
    button { font: inherit; }
    a:focus-visible, button:focus-visible { outline: 3px solid #8bb79a; outline-offset: 4px; border-radius: 4px; }
    .wrap { width: min(100% - 48px, 1040px); margin-inline: auto; }
    .site-header { padding: 21px 0; border-bottom: 1px solid var(--line); }
    .nav { display: flex; align-items: center; justify-content: space-between; gap: 20px; }
    .brand { display: inline-flex; align-items: center; gap: 10px; text-decoration: none; font-family: var(--serif); font-size: 21px; font-weight: 700; letter-spacing: -.04em; }
    .brand-mark { display: grid; width: 34px; height: 34px; place-items: center; border-radius: 11px; color: #fff; background: #33745b; font: 700 16px var(--sans); }
    .nav-tools { display: flex; align-items: center; gap: 10px; }
    .nav-note { display: inline-flex; align-items: center; gap: 8px; margin-right: 8px; color: var(--muted); font-size: 12px; letter-spacing: .04em; }
    .nav-note::before { width: 7px; height: 7px; border-radius: 50%; background: #75a982; content: ""; }
    .tool-button { min-width: 42px; min-height: 38px; padding: 7px 11px; border: 1px solid var(--line); border-radius: 11px; color: var(--ink); background: var(--surface); cursor: pointer; }
    .tool-button:hover { border-color: var(--accent); color: var(--accent-dark); }
    .hero { position: relative; overflow: hidden; margin: 40px 0 72px; padding: clamp(42px, 7vw, 82px); border: 1px solid var(--line); border-radius: 28px; background: radial-gradient(ellipse at 93% 5%, rgba(181, 207, 174, .22), transparent 34%), linear-gradient(135deg, var(--surface) 0%, var(--paper) 100%); box-shadow: var(--shadow); }
    .hero::after { position: absolute; right: 7%; bottom: -96px; width: 250px; height: 250px; border: 1px solid rgba(115, 171, 133, .18); border-radius: 50%; box-shadow: 0 0 0 22px rgba(115, 171, 133, .04), 0 0 0 48px rgba(115, 171, 133, .03); content: ""; pointer-events: none; }
    .eyebrow { display: inline-flex; align-items: center; gap: 9px; color: var(--accent-dark); font-size: 11px; font-weight: 750; letter-spacing: .16em; text-transform: uppercase; }
    .eyebrow::before { width: 21px; height: 1px; background: currentColor; content: ""; }
    .hero h1 { position: relative; z-index: 1; max-width: 700px; margin: 20px 0 17px; font-family: var(--serif); font-size: clamp(38px, 6vw, 66px); font-weight: 600; letter-spacing: -.055em; line-height: 1.35; }
    .hero p { position: relative; z-index: 1; max-width: 540px; margin: 0; color: var(--hero-text); font-size: clamp(15px, 2vw, 17px); }
    .hero-meta { position: relative; z-index: 1; display: flex; align-items: center; gap: 10px; margin-top: 30px; color: var(--muted); font-size: 12px; }
    .hero-meta span { padding: 6px 12px; border: 1px solid var(--line); border-radius: 999px; background: var(--surface); }
    .section-heading { display: flex; align-items: end; justify-content: space-between; gap: 16px; margin-bottom: 17px; }
    .section-title { margin: 0; font-family: var(--serif); font-size: 27px; letter-spacing: -.04em; }
    .section-kicker { display: block; margin-bottom: 2px; color: var(--muted); font-size: 11px; letter-spacing: .12em; text-transform: uppercase; }
    .count { padding: 5px 11px; border: 1px solid var(--line); border-radius: 999px; color: var(--muted); background: var(--surface); font-size: 12px; white-space: nowrap; }
    .posts { padding-bottom: 76px; }
    #articles { overflow: hidden; border: 1px solid var(--line); border-radius: 20px; background: var(--surface); box-shadow: 0 10px 35px rgba(0, 0, 0, .04); }
    .post { display: grid; grid-template-columns: 132px minmax(0, 1fr); gap: 26px; padding: 30px 34px; transition: background .2s ease; }
    .post + .post { border-top: 1px solid var(--line); }
    .post:hover { background: var(--hover); }
    .date { padding-top: 5px; color: var(--muted); font-size: 12px; white-space: nowrap; }
    .post h3 { margin: 0 0 10px; font-family: var(--serif); font-size: 22px; font-weight: 650; letter-spacing: -.025em; line-height: 1.45; }
    .post h3 a { text-decoration: none; text-decoration-color: transparent; text-underline-offset: 4px; transition: color .18s ease, text-decoration-color .18s ease; }
    .post h3 a:hover { color: var(--accent); text-decoration: underline; text-decoration-color: currentColor; }
    .article-body { color: var(--hero-text); font-size: 14px; overflow-wrap: anywhere; }
    .article-body > :first-child { margin-top: 0; }
    .article-body > :last-child { margin-bottom: 0; }
    .article-body p { margin: 11px 0; }
    .article-body h1, .article-body h2, .article-body h3 { margin: 22px 0 9px; color: var(--ink); font-family: var(--serif); line-height: 1.4; }
    .article-body h1 { font-size: 22px; }
    .article-body h2 { font-size: 19px; }
    .article-body h3 { font-size: 17px; }
    .article-body a { color: var(--accent-dark); text-decoration-thickness: 1px; text-underline-offset: 3px; }
    .article-body blockquote { margin: 16px 0; padding: 2px 0 2px 16px; border-left: 3px solid var(--accent); color: var(--muted); }
    .article-body ul, .article-body ol { padding-left: 24px; }
    .article-body li { padding-left: 3px; margin: 4px 0; }
    .article-body code { padding: 2px 6px; border: 1px solid var(--line); border-radius: 5px; color: var(--accent-dark); background: var(--code-bg); font: .9em ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
    .article-body pre { overflow-x: auto; margin: 16px 0; padding: 17px 19px; border: 1px solid var(--line); border-radius: 12px; background: var(--pre-bg); line-height: 1.65; }
    .article-body pre code { padding: 0; border: 0; background: transparent; }
    .tags { display: flex; flex-wrap: wrap; gap: 7px; margin-top: 16px; }
    .tag { padding: 3px 10px; border: 1px solid var(--line); border-radius: 999px; color: var(--accent-dark); background: var(--tag-bg); font-size: 11px; }
    .status, .empty { padding: 42px 32px; color: var(--muted); text-align: center; font-size: 14px; }
    .status.error { color: #c56e5d; }
    .empty strong { display: block; margin-bottom: 5px; color: var(--ink); font-family: var(--serif); font-size: 20px; }
    .site-footer { padding: 25px 0 34px; border-top: 1px solid var(--line); color: var(--muted); font-size: 12px; }
    .site-footer .wrap { display: flex; justify-content: space-between; gap: 16px; }
    .site-footer a { color: var(--accent-dark); text-decoration: none; }
    .site-footer a:hover { text-decoration: underline; }
    @media (max-width: 640px) {
      .wrap { width: min(100% - 32px, 1040px); }
      .site-header { padding: 16px 0; }
      .nav { gap: 10px; }
      .nav-tools { gap: 7px; }
      .nav-note { display: none; }
      .hero { margin: 24px 0 52px; padding: 37px 25px 34px; border-radius: 22px; }
      .hero::after { right: -130px; bottom: -125px; }
      .hero h1 { margin-top: 16px; font-size: clamp(37px, 10vw, 53px); }
      .hero-meta { flex-wrap: wrap; margin-top: 22px; }
      .section-title { font-size: 24px; }
      .post { grid-template-columns: 1fr; gap: 5px; padding: 23px 21px; }
      .date { padding: 0; font-size: 11px; }
      .post h3 { margin-bottom: 8px; font-size: 20px; }
      #articles { border-radius: 16px; }
      .site-footer .wrap { flex-direction: column; gap: 4px; }
    }
    @media (prefers-reduced-motion: reduce) { *, *::before, *::after { scroll-behavior: auto !important; transition-duration: .01ms !important; } }
  </style>
</head>
<body>
  <header class="site-header">
    <div class="wrap nav">
      <a class="brand" href="#top" aria-label="Mecha 博客首页"><span class="brand-mark">M</span><span>Mecha<span style="color:var(--accent)">.</span></span></a>
      <div class="nav-tools">
        <span class="nav-note" data-i18n="navNote">写于 GitHub Issues 之上</span>
        <button class="tool-button" id="language-toggle" type="button" aria-label="Switch to English" title="Switch to English">EN</button>
        <button class="tool-button" id="theme-toggle" type="button" aria-label="切换为暗黑模式" title="切换为暗黑模式"><span id="theme-icon" aria-hidden="true">☾</span></button>
      </div>
    </div>
  </header>
  <main class="wrap" id="top">
    <section class="hero" aria-labelledby="welcome-title">
      <div class="eyebrow" data-i18n="eyebrow">Personal blog · Since 2026</div>
      <h1 id="welcome-title" data-i18n="welcome">既见君子 ，云胡不喜</h1>
      <p data-i18n="intro">在这里记录正在思考的事、正在经历的生活，以及那些值得分享的瞬间。愿文字让日常变得清晰，也让相遇发生。</p>
      <div class="hero-meta"><span data-i18n="metaOne">慢慢写，认真生活</span><span data-i18n="metaTwo">随笔 · 记录 · 分享</span></div>
    </section>
    <section class="posts" aria-labelledby="posts-heading">
      <div class="section-heading"><div><span class="section-kicker" data-i18n="kicker">From my notebook</span><h2 class="section-title" id="posts-heading" data-i18n="postsTitle">最近的文章</h2></div><span class="count" id="count" aria-live="polite"></span></div>
      <div id="articles" class="status" aria-live="polite" data-i18n="loading">正在寻找最新的文字…</div>
    </section>
  </main>
  <footer class="site-footer"><div class="wrap"><span data-i18n="footerSource">文章通过 <a href="https://github.com/mechatsvip/mechatsvip.github.io/issues">GitHub Issues</a> 发布</span><span>© <span id="year"></span> <span data-i18n="footerNote">Mecha · 慢慢写，认真生活</span></span></div></footer>
  <script>
    const OWNER = 'mechatsvip';
    const REPO = 'mechatsvip.github.io';
    const API = `https://api.github.com/repos/${OWNER}/${REPO}/issues?state=all&per_page=100&sort=created&direction=desc`;
    const issueUrl = `https://github.com/${OWNER}/${REPO}/issues/`;
    const root = document.getElementById('articles');
    const translations = {
      zh: {
        navNote: '写于 GitHub Issues 之上', eyebrow: 'Personal blog · Since 2026', welcome: '既见君子 ，云胡不喜',
        intro: '在这里记录正在思考的事、正在经历的生活，以及那些值得分享的瞬间。愿文字让日常变得清晰，也让相遇发生。',
        metaOne: '慢慢写，认真生活', metaTwo: '随笔 · 记录 · 分享', kicker: 'From my notebook', postsTitle: '最近的文章',
        loading: '正在寻找最新的文字…', emptyTitle: '第一篇文章，等你来写。', emptyText: '在仓库的 Issues 中新建一篇文章，它就会出现在这里。',
        loadError: '文章暂时无法加载', tryAgain: '请稍后刷新，或直接前往 GitHub Issues 阅读。',
        footerSource: '文章通过 <a href="https://github.com/mechatsvip/mechatsvip.github.io/issues">GitHub Issues</a> 发布',
        footerNote: 'Mecha · 慢慢写，认真生活', themeLight: '切换为浅色模式', themeDark: '切换为暗黑模式',
        languageLabel: 'Switch to English', count: n => `${n} 篇`, dateLocale: 'zh-CN'
      },
      en: {
        navNote: 'Powered by GitHub Issues', eyebrow: 'Personal blog · Since 2026', welcome: 'Having met you, how could I not be glad?',
        intro: 'A little place for thoughts, everyday life, and moments worth sharing. May these words bring clarity to ordinary days and make room for meaningful encounters.',
        metaOne: 'Write slowly, live fully', metaTwo: 'Notes · Life · Stories', kicker: 'From my notebook', postsTitle: 'Recent posts',
        loading: 'Looking for the latest stories…', emptyTitle: 'Your first post is waiting.', emptyText: 'Create a post in this repository’s Issues and it will appear here.',
        loadError: 'Posts are temporarily unavailable', tryAgain: 'Please refresh later, or visit GitHub Issues to read them.',
        footerSource: 'Posts published via <a href="https://github.com/mechatsvip/mechatsvip.github.io/issues">GitHub Issues</a>',
        footerNote: 'Mecha · Write slowly, live fully', themeLight: 'Switch to light mode', themeDark: 'Switch to dark mode',
        languageLabel: '切换为中文', count: n => `${n} posts`, dateLocale: 'en-US'
      }
    };
    let language = 'zh';
    let allIssues = [];
    document.getElementById('year').textContent = new Date().getFullYear();

    function applyLanguage() {
      const words = translations[language];
      document.documentElement.lang = language === 'zh' ? 'zh-CN' : 'en';
      document.querySelectorAll('[data-i18n]').forEach(element => {
        const key = element.dataset.i18n;
        if (words[key] !== undefined) element.innerHTML = words[key];
      });
      const langButton = document.getElementById('language-toggle');
      langButton.textContent = language === 'zh' ? 'EN' : '中文';
      langButton.setAttribute('aria-label', words.languageLabel);
      langButton.title = words.languageLabel;
      if (allIssues.length || root.classList.contains('empty')) render(allIssues);
    }

    function applyTheme() {
      const dark = document.documentElement.dataset.theme === 'dark';
      const button = document.getElementById('theme-toggle');
      const label = dark ? translations[language].themeLight : translations[language].themeDark;
      document.getElementById('theme-icon').textContent = dark ? '☀' : '☾';
      button.setAttribute('aria-label', label);
      button.title = label;
      document.querySelector('meta[name="theme-color"]').content = dark ? '#151a17' : '#f6f7f2';
    }

    document.getElementById('language-toggle').addEventListener('click', () => {
      language = language === 'zh' ? 'en' : 'zh';
      applyLanguage();
      applyTheme();
    });
    document.getElementById('theme-toggle').addEventListener('click', () => {
      const theme = document.documentElement.dataset.theme === 'dark' ? 'light' : 'dark';
      document.documentElement.dataset.theme = theme;
      try { localStorage.setItem('mecha-theme', theme); } catch (_) {}
      applyTheme();
    });

    function escapeHtml(value) {
      return String(value).replace(/[&<>"']/g, ch => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[ch]));
    }
    function inline(text) {
      let out = escapeHtml(text);
      out = out.replace(/`([^`]+)`/g, '<code>$1</code>')
        .replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>')
        .replace(/\*(.+?)\*/g, '<em>$1</em>')
        .replace(/~~(.+?)~~/g, '<del>$1</del>')
        .replace(/\[([^\]]+)\]\((https?:\/\/[^\s)]+)\)/g, '<a href="$2" target="_blank" rel="noopener noreferrer">$1</a>');
      return out;
    }
    function markdown(source) {
      if (!source) return '';
      const lines = source.replace(/\r/g, '').split('\n');
      const html = [];
      let paragraph = [], list = '', code = false, codeLines = [], quote = [];
      const flushParagraph = () => { if (paragraph.length) { html.push(`<p>${paragraph.map(inline).join('<br>')}</p>`); paragraph = []; } };
      const flushQuote = () => { if (quote.length) { html.push(`<blockquote><p>${quote.map(inline).join('<br>')}</p></blockquote>`); quote = []; } };
      const flushList = () => { if (list) { html.push(`</${list}>`); list = ''; } };
      for (const line of lines) {
        if (/^\s*```/.test(line)) {
          flushParagraph(); flushQuote(); flushList();
          if (code) { html.push(`<pre><code>${escapeHtml(codeLines.join('\n'))}</code></pre>`); codeLines = []; }
          code = !code;
          continue;
        }
        if (code) { codeLines.push(line); continue; }
        const heading = line.match(/^(#{1,3})\s+(.+)$/);
        const item = line.match(/^\s*([-*+]\s+|\d+\.\s+)(.+)$/);
        if (heading) {
          flushParagraph(); flushQuote(); flushList();
          const n = heading[1].length;
          html.push(`<h${n}>${inline(heading[2])}</h${n}>`);
        } else if (/^>\s?/.test(line)) {
          flushParagraph(); flushList(); quote.push(line.replace(/^>\s?/, ''));
        } else if (item) {
          flushParagraph(); flushQuote();
          const nextList = /^\d/.test(item[1]) ? 'ol' : 'ul';
          if (list && list !== nextList) flushList();
          if (!list) { list = nextList; html.push(`<${list}>`); }
          html.push(`<li>${inline(item[2])}</li>`);
        } else if (!line.trim()) {
          flushParagraph(); flushQuote(); flushList();
        } else {
          flushQuote(); flushList(); paragraph.push(line);
        }
      }
      flushParagraph(); flushQuote(); flushList();
      if (code) html.push(`<pre><code>${escapeHtml(codeLines.join('\n'))}</code></pre>`);
      return html.join('\n');
    }
    function formatDate(value) {
      return new Intl.DateTimeFormat(translations[language].dateLocale, {year:'numeric', month:'long', day:'numeric'}).format(new Date(value));
    }
    function render(issues) {
      const words = translations[language];
      const articles = issues.filter(item => !item.pull_request);
      document.getElementById('count').textContent = words.count(articles.length);
      if (!articles.length) {
        root.className = 'empty';
        root.innerHTML = `<strong>${words.emptyTitle}</strong>${words.emptyText}`;
        return;
      }
      root.className = '';
      root.innerHTML = articles.map(issue => `
        <article class="post" id="issue-${issue.number}">
          <time class="date" datetime="${escapeHtml(issue.created_at)}">${formatDate(issue.created_at)}</time>
          <div><h3><a href="${issueUrl}${issue.number}" target="_blank" rel="noopener noreferrer">${escapeHtml(issue.title)}</a></h3>
          <div class="article-body">${markdown(issue.body || '')}</div>
          ${issue.labels?.length ? `<div class="tags">${issue.labels.map(label => `<span class="tag">${escapeHtml(label.name)}</span>`).join('')}</div>` : ''}
          </div>
        </article>`).join('');
    }
    applyLanguage();
    applyTheme();
    fetch(API, {headers:{Accept:'application/vnd.github+json'}})
      .then(response => { if (!response.ok) throw new Error(`GitHub API ${response.status}`); return response.json(); })
      .then(issues => { allIssues = issues; render(allIssues); })
      .catch(() => {
        root.className = 'status error';
        root.innerHTML = `${translations[language].loadError}. ${translations[language].tryAgain}`;
      });
  </script>
</body>
</html>
